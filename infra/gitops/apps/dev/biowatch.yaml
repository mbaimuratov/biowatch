apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: biowatch-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: biowatch

  sources:
    - repoURL: https://github.com/mbaimuratov/biowatch.git
      targetRevision: main
      path: infra/helm/biowatch
      helm:
        valueFiles:
          - $values/infra/gitops/environments/dev/values.yaml
    - repoURL: https://github.com/mbaimuratov/biowatch.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: biowatch-dev

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: biowatch
  namespace: biowatch
  labels:
    app.kubernetes.io/name: biowatch
    app.kubernetes.io/component: api
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - biowatch.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: biowatch-api
          port: 8000

{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "biowatch.fullname" . }}
  labels:
    {{- include "biowatch.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "biowatch.fullname" . }}-api
          port: {{ .Values.api.service.port }}
{{- end }}
